# Palius Social Media OS — full stack (backend API + web app + admin panel).
#
#   cp .env.example .env    # optional: add your AI provider keys
#   docker compose up -d --build
#
# URLs:
#   App     -> http://localhost:3000
#   Admin   -> http://localhost:3001
#   API     -> http://localhost:8080/api/v1
#
# The frontend/admin hit the API from the BROWSER, so the backend port is
# published on the host. If you access from another machine, change the
# NEXT_PUBLIC_PALIUS_API build args to your machine's host/IP.

services:
  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      # When DATABASE_URL is set the backend uses Neon/Postgres and ignores
      # PALIUS_DB (see db.go: openDatabase). That is what lets a local run write
      # a captured browser session into the SAME database the deployed API reads
      # from — the worker only has to exist at capture time, not afterwards.
      # Leave it empty to fall back to the local SQLite file below.
      DATABASE_URL: ${DATABASE_URL:-}
      PALIUS_DB: /data/palius.db
      # Guards /api/v1/admin/*. Generate with `openssl rand -base64 32`, put it
      # in .env, then paste the same value into the admin panel when it asks.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      # OpenAI / OpenAI-compatible
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Anthropic Claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      # Google Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      # DeepSeek (OpenAI-compatible)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # OpenRouter (many models)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      # Ollama (local, OpenAI-compatible) — reach it via host.docker.internal
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      # Credential encryption. Required before anything — API keys or captured
      # browser sessions — can be stored at all.
      PALIUS_SECRET_KEY: ${PALIUS_SECRET_KEY:-}
      # Level 3 browser login. The API reaches the worker over the compose
      # network; the user's browser reaches it on the published host port, so
      # the two URLs genuinely differ here.
      PLAYWRIGHT_WORKER_URL: http://worker:8090
      PLAYWRIGHT_WORKER_PUBLIC_URL: ${PLAYWRIGHT_WORKER_PUBLIC_URL:-http://localhost:8090}
      PLAYWRIGHT_WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-worker-token}
    ports:
      - "8080:8080"
    volumes:
      - palius_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Level 3 connectors — the embedded browser users log into platforms through.
  # Runs a real Chromium, so it is by far the heaviest service here: budget
  # ~1GB before concurrent logins, and note the shm_size below. Comment this
  # service out and the rest of the stack still works; the connect dialog just
  # reports browser login as unavailable instead of failing at it.
  worker:
    build:
      context: ./apps/worker
    restart: unless-stopped
    environment:
      PORT: "8090"
      WORKER_TOKEN: ${WORKER_TOKEN:-local-dev-worker-token}
      # The user's browser opens the frame stream directly, so the web app's
      # origins have to be allowed here.
      ALLOWED_ORIGINS: ${WORKER_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      WORKER_MAX_SESSIONS: ${WORKER_MAX_SESSIONS:-4}
    ports:
      - "8090:8090"
    # Chromium's default 64MB /dev/shm is not enough and it will crash on a
    # media-heavy login page without this.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_PALIUS_API: http://localhost:8080/api/v1
        NEXT_PUBLIC_PALIUS_USER_ID: user-1
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  admin:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_PALIUS_API: http://localhost:8080/api/v1
        NEXT_PUBLIC_PALIUS_USER_ID: user-1
    restart: unless-stopped
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  palius_data:
